upstream pedidos_backend {
    server pedidos-service:8083 max_fails=1 fail_timeout=10s;
    server pedidos-service-2:8083 max_fails=1 fail_timeout=10s;
    server pedidos-service-3:8083 max_fails=1 fail_timeout=10s;
}

upstream cardapio_backend {
    server cardapio-service:8082 max_fails=1 fail_timeout=10s;
    server cardapio-service-2:8082 max_fails=1 fail_timeout=10s;
    server cardapio-service-3:8082 max_fails=1 fail_timeout=10s;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/api/pedidos(/|$) {
        proxy_pass http://pedidos_backend;
        proxy_set_header Host $host;
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout;
        add_header X-Backend $upstream_addr always;
    }

    location ~ ^/api/produtos(/|$) {
    proxy_pass http://cardapio_backend;
    proxy_set_header Host $host;
    proxy_connect_timeout 1s;
    proxy_next_upstream error timeout;
    add_header X-Backend $upstream_addr always;
    }
}