services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: postgres-churrasqueiro
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: churrasqueiro_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - churrasqueiro-net

  kafka:
    image: docker.io/apache/kafka:3.8.0
    container_name: kafka-churrasqueiro
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - churrasqueiro-net

  kafka-ui:
    image: docker.io/provectuslabs/kafka-ui:latest
    container_name: kafka-ui-churrasqueiro
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: churrasqueiro-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - churrasqueiro-net

  cardapio-service:
    build:
      context: ./backend/cardapio-service
    container_name: cardapio-service-churrasqueiro
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/churrasqueiro_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8082
    depends_on:
      - postgres
      - kafka
    networks:
      - churrasqueiro-net
    restart: unless-stopped

  cardapio-service-2:
    build:
      context: ./backend/cardapio-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/churrasqueiro_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8082
    depends_on:
      - postgres
      - kafka
    networks:
      - churrasqueiro-net
    restart: unless-stopped

  cardapio-service-3:
    build:
      context: ./backend/cardapio-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/churrasqueiro_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8082
    depends_on:
      - postgres
      - kafka
    networks:
      - churrasqueiro-net
    restart: unless-stopped

  gestao-service:
    build:
      context: ./backend/gestao-service
    container_name: gestao-service-churrasqueiro
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/churrasqueiro_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8081
    depends_on:
      - postgres
      - kafka
    networks:
      - churrasqueiro-net
    restart: unless-stopped

  pedidos-service:
    build:
      context: ./backend/pedidos-service
    container_name: pedidos-service-churrasqueiro
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/churrasqueiro_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8083
    depends_on:
      - postgres
      - kafka
    networks:
      - churrasqueiro-net
    restart: unless-stopped

  pedidos-service-2:
    build:
      context: ./backend/pedidos-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/churrasqueiro_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8083
    depends_on:
      - postgres
      - kafka
    networks:
      - churrasqueiro-net
    restart: unless-stopped

  pedidos-service-3:
    build:
      context: ./backend/pedidos-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/churrasqueiro_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8083
    depends_on:
      - postgres
      - kafka
    networks:
      - churrasqueiro-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: frontend-churrasqueiro
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gestao-service
      - cardapio-service
      - pedidos-service
    networks:
      - churrasqueiro-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  churrasqueiro-net:
    driver: bridge